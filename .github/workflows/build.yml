name: Build DashCam iOS IPA
on:
  workflow_dispatch:

jobs:
  build_ipa:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: 拉取仓库全部源码
        uses: actions/checkout@v4

      - name: Xcode Archive归档
        run: |
          xcodebuild archive \
          -project dashcam.xcodeproj \
          -scheme dashcam \
          -configuration Release \
          -archivePath build/dashcam.xcarchive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

      - name: 手动打包生成IPA
        run: |
          mkdir -p build/output/Payload
          cp -r build/dashcam.xcarchive/Products/Applications/*.app build/output/Payload/
          cd build/output
          zip -r dashcam.ipa Payload

      - name: 上传IPA产物
        uses: actions/upload-artifact@v4
        with:
          name: dashcam-ipa
          path: build/output/dashcam.ipa
